<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the app paint under the notch and the home
      indicator; the CSS then pads content back with env(safe-area-inset-*).
      user-scalable is left alone on purpose — blocking pinch-zoom is an
      accessibility failure, and the 16px input rule already stops iOS from
      auto-zooming on focus.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1120" />
    <meta
      name="description"
      content="Split trip expenses with friends. Works fully offline, no account, no server."
    />
    <!-- Tells iOS to launch from the home screen without Safari's chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TripSplit" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/favicon.png" />
    <title>TripSplit</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>TripSplit needs JavaScript. Please enable it and reload.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
